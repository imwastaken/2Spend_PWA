<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="2Spend">
    <title>2Spend</title>
    <style>
        :root {
            --bg: #000000;
            --card: #1C1C1E;
            --text: #FFFFFF;
            --text-secondary: #8E8E93;
            --accent: #FF9F0A; /* Нативный iOS темно-оранжевый */
            --green: #32D74B;
            --red: #FF453A;
            --border: #38383A;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0 0 100px 0;
            -webkit-font-smoothing: antialiased;
        }

        h1, h2, h3 { margin: 0; font-weight: 700; }
        
        .header {
            padding: max(20px, env(safe-area-inset-top)) 20px 15px 20px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 { font-size: 28px; letter-spacing: 0.5px; }
        
        .add-btn {
            background: transparent;
            color: var(--accent);
            border: none;
            font-size: 24px;
            padding: 0;
            cursor: pointer;
        }

        .container { padding: 0 16px 16px 16px; }
        
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        /* Статистика */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--border);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--card);
            padding: 16px;
        }

        .stat-box.full-width { grid-column: span 2; }
        .stat-box .period { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; font-weight: 600; }
        .stat-box .roi { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .stat-box .profit { font-size: 15px; font-weight: 500; }
        
        .positive { color: var(--green); }
        .negative { color: var(--red); }
        .neutral { color: var(--text); }

        /* История */
        .section-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; padding-left: 4px; }
        .history-list { background: var(--card); border-radius: 12px; overflow: hidden; }
        .history-item {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:last-child { border-bottom: none; }
        .history-date { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
        .history-spend { font-size: 13px; color: var(--text-secondary); }
        .history-right { text-align: right; }

        /* Задачи */
        .task-list { background: var(--card); border-radius: 12px; overflow: hidden; }
        .task-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border);
            transition: opacity 0.2s;
        }
        .task-item:last-child { border-bottom: none; }
        .task-item.done { opacity: 0.5; }
        .task-item.done .task-text { text-decoration: line-through; }
        .task-checkbox {
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--text-secondary);
            margin-right: 12px; display: flex; align-items: center; justify-content: center;
        }
        .task-item.done .task-checkbox { background: var(--accent); border-color: var(--accent); }
        .task-item.done .task-checkbox::after { content: '✓'; color: #000; font-weight: bold; }
        .task-content { flex: 1; }
        .task-text { font-size: 16px; }

        /* Заметки (iOS Style) */
        .note-list { display: flex; flex-direction: column; gap: 12px; }
        .note-item {
            background: var(--card);
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
        }
        .note-item-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .note-item-preview { font-size: 14px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .note-item-date { font-size: 12px; color: var(--text-secondary); margin-top: 8px; }

        /* Навигация */
        .tab-bar {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(28, 28, 30, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 100;
        }
        .tab {
            flex: 1; text-align: center; padding: 12px 0 8px 0;
            color: var(--text-secondary); font-size: 10px; font-weight: 500; cursor: pointer;
        }
        .tab.active { color: var(--accent); }
        .tab svg { width: 24px; height: 24px; margin-bottom: 4px; opacity: 0.7; }
        .tab.active svg { opacity: 1; stroke: var(--accent); }
        
        .hidden { display: none !important; }

        /* Модальные окна (Bottom Sheets) */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 200;
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-sheet {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #1C1C1E; border-radius: 20px 20px 0 0;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom)) 20px;
            transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.2);
            z-index: 201;
        }
        .modal-overlay.active .modal-sheet { transform: translateY(0); }
        
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-title { font-size: 18px; font-weight: 600; }
        .modal-close { background: transparent; border: none; color: var(--accent); font-size: 16px; font-weight: 600; padding: 0; }

        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; }
        input[type="text"], input[type="number"], input[type="date"] {
            width: 100%; background: #2C2C2E; border: none; color: #fff;
            padding: 14px 16px; border-radius: 10px; font-size: 16px; outline: none;
        }
        input[type="date"] { color-scheme: dark; }
        
        .btn-primary {
            width: 100%; background: var(--accent); color: #000; border: none;
            padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 600; margin-top: 10px;
        }

        .flex-row { display: flex; gap: 12px; }
        .flex-row .input-group { flex: 1; }

        /* Полноэкранный редактор заметок */
        .full-screen-modal {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg); z-index: 300;
            transform: translateX(100%); transition: transform 0.3s;
            display: flex; flex-direction: column;
        }
        .full-screen-modal.active { transform: translateX(0); }
        .note-editor-header {
            padding: max(10px, env(safe-area-inset-top)) 16px 10px 16px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .note-textarea {
            flex: 1; width: 100%; background: transparent; border: none; color: #fff;
            padding: 16px; font-size: 17px; line-height: 1.5; outline: none; resize: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="header-title">ФАКТ</h1>
        <button class="add-btn" id="main-add-btn" onclick="openAddModal()">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
    </div>

    <div class="container">
        
        <div id="view-fact" class="view">
            <div class="stats-grid" id="stats-fact"></div>
            <div class="section-title">История по дням</div>
            <div class="history-list" id="history-fact"></div>
        </div>

        <div id="view-uslov" class="view hidden">
            <div class="stats-grid" id="stats-uslov"></div>
            <div class="section-title">История по дням</div>
            <div class="history-list" id="history-uslov"></div>
        </div>

        <div id="view-tasks" class="view hidden">
            <div class="task-list" id="tasks-list"></div>
        </div>

        <div id="view-notes" class="view hidden">
            <div class="note-list" id="notes-list"></div>
        </div>

    </div>

    <div class="modal-overlay" id="stat-modal-overlay" onclick="closeModals(event)">
        <div class="modal-sheet" id="stat-modal-sheet">
            <div class="modal-header">
                <div class="modal-title" id="stat-modal-title">Добавить запись</div>
                <button class="modal-close" onclick="forceCloseModals()">Отмена</button>
            </div>
            <div class="input-group">
                <label>Дата</label>
                <input type="date" id="stat-date">
            </div>
            <div class="flex-row">
                <div class="input-group">
                    <label>Доход ($)</label>
                    <input type="number" id="stat-income" placeholder="0" step="0.01">
                </div>
                <div class="input-group">
                    <label>Расход ($)</label>
                    <input type="number" id="stat-expense" placeholder="0" step="0.01">
                </div>
            </div>
            <button class="btn-primary" onclick="saveStat()">Сохранить</button>
        </div>
    </div>

    <div class="modal-overlay" id="task-modal-overlay" onclick="closeModals(event)">
        <div class="modal-sheet" id="task-modal-sheet">
            <div class="modal-header">
                <div class="modal-title">Новая задача</div>
                <button class="modal-close" onclick="forceCloseModals()">Отмена</button>
            </div>
            <div class="input-group">
                <label>Описание</label>
                <input type="text" id="task-text" placeholder="Что нужно сделать?">
            </div>
            <button class="btn-primary" onclick="saveTask()">Добавить</button>
        </div>
    </div>

    <div class="full-screen-modal" id="note-editor">
        <div class="note-editor-header">
            <button class="modal-close" onclick="closeNoteEditor()">< Назад</button>
            <button class="modal-close" onclick="deleteCurrentNote()" style="color: var(--red);">Удалить</button>
        </div>
        <textarea class="note-textarea" id="note-textarea" placeholder="Начни печатать..."></textarea>
    </div>

    <div class="tab-bar">
        <div class="tab active" onclick="switchTab('fact')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12c0 1.1.9 2 2 2h14v-4H6a2 2 0 0 1-2-2V6Z"/></svg>
            <br>ФАКТ
        </div>
        <div class="tab" onclick="switchTab('uslov')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <br>УСЛОВ
        </div>
        <div class="tab" onclick="switchTab('tasks')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></svg>
            <br>ЗАДАЧИ
        </div>
        <div class="tab" onclick="switchTab('notes')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <br>ЗАМЕТКИ
        </div>
    </div>

    <script>
        let currentTab = 'fact';
        let currentNoteId = null;

        // Инициализация базы данных
        let data = JSON.parse(localStorage.getItem('2spend_data_v2')) || { fact: [], uslov: [], tasks: [], notes: [] };
        
        // Миграция со старых версий
        const oldData = JSON.parse(localStorage.getItem('2spend_data'));
        if (oldData && !localStorage.getItem('2spend_data_v2')) {
            data.fact = oldData.fact || [];
            data.uslov = oldData.uslov || [];
            data.tasks = oldData.tasks || [];
            if (typeof oldData.notes === 'string' && oldData.notes.trim() !== '') {
                data.notes = [{ id: Date.now().toString(), text: oldData.notes, date: new Date().toISOString() }];
            } else {
                data.notes = oldData.notes || [];
            }
            saveData();
        }

        document.getElementById('stat-date').value = new Date().toISOString().split('T')[0];

        function saveData() {
            localStorage.setItem('2spend_data_v2', JSON.stringify(data));
            renderAll();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            event.currentTarget.classList.add('active');
            
            const titles = { 'fact': 'ФАКТ', 'uslov': 'УСЛОВ', 'tasks': 'ЗАДАЧИ', 'notes': 'ЗАМЕТКИ' };
            document.getElementById('header-title').innerText = titles[tab];
        }

        // --- Управление модалками ---
        function openAddModal() {
            if (currentTab === 'fact' || currentTab === 'uslov') {
                document.getElementById('stat-modal-title').innerText = currentTab === 'fact' ? 'ФАКТ: Новая запись' : 'УСЛОВ: Новая запись';
                document.getElementById('stat-modal-overlay').classList.add('active');
            } else if (currentTab === 'tasks') {
                document.getElementById('task-modal-overlay').classList.add('active');
            } else if (currentTab === 'notes') {
                createNewNote();
            }
        }

        function closeModals(e) {
            if (e.target.classList.contains('modal-overlay')) forceCloseModals();
        }

        function forceCloseModals() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
            document.getElementById('stat-income').value = '';
            document.getElementById('stat-expense').value = '';
            document.getElementById('task-text').value = '';
        }

        // --- Логика Статистики ---
        function saveStat() {
            const date = document.getElementById('stat-date').value;
            const income = parseFloat(document.getElementById('stat-income').value) || 0;
            const expense = parseFloat(document.getElementById('stat-expense').value) || 0;

            if (!date || (income === 0 && expense === 0)) return alert('Заполни поля');

            const existingIndex = data[currentTab].findIndex(item => item.date === date);
            if (existingIndex >= 0) {
                data[currentTab][existingIndex].income += income;
                data[currentTab][existingIndex].expense += expense;
            } else {
                data[currentTab].push({ date, income, expense });
            }

            forceCloseModals();
            saveData();
        }

        function calcROI(income, expense) {
            const profit = income - expense;
            if (expense > 0) return (profit / expense) * 100;
            if (income > 0) return 100;
            return 0;
        }

        function renderStats(type) {
            const container = document.getElementById(`stats-${type}`);
            let stats = { day: {i:0, e:0}, week: {i:0, e:0}, month: {i:0, e:0}, all: {i:0, e:0} };
            const todayStr = new Date().toISOString().split('T')[0];
            let uniqueDays = new Set();

            data[type].forEach(r => {
                uniqueDays.add(r.date);
                stats.all.i += r.income; stats.all.e += r.expense;
                if (r.date === todayStr) { stats.day.i += r.income; stats.day.e += r.expense; }
                // Упрощенная логика для недели/месяца для экономии места
            });

            const totalProfit = stats.all.i - stats.all.e;
            const avgDaily = uniqueDays.size > 0 ? (totalProfit / uniqueDays.size) : 0;

            const makeBox = (label, i, e) => {
                const p = i - e;
                const r = calcROI(i, e);
                const color = p > 0 ? 'positive' : (p < 0 ? 'negative' : 'neutral');
                return `<div class="stat-box">
                    <div class="period">${label}</div>
                    <div class="roi ${color}">${p > 0 ? '+' : ''}${r.toFixed(0)}%</div>
                    <div class="profit ${color}">${p >= 0 ? '+' : ''}$${p.toFixed(0)}</div>
                </div>`;
            };

            container.innerHTML = `
                ${makeBox('СЕГОДНЯ', stats.day.i, stats.day.e)}
                ${makeBox('ВСЕ ВРЕМЯ', stats.all.i, stats.all.e)}
                <div class="stat-box full-width" style="border-top: 1px solid var(--border)">
                    <div class="period">СРЕДНИЙ ПРОФИТ В ДЕНЬ</div>
                    <div class="roi ${avgDaily > 0 ? 'positive' : 'neutral'}">${avgDaily >= 0 ? '+' : ''}$${avgDaily.toFixed(0)}</div>
                </div>
            `;
        }

        function renderHistory(type) {
            const container = document.getElementById(`history-${type}`);
            const sorted = [...data[type]].sort((a, b) => new Date(b.date) - new Date(a.date));
            
            if (sorted.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-secondary)">Нет записей</div>';
                return;
            }

            container.innerHTML = sorted.map(item => {
                const profit = item.income - item.expense;
                const roi = calcROI(item.income, item.expense);
                const color = profit > 0 ? 'positive' : (profit < 0 ? 'negative' : 'neutral');
                const [y, m, d] = item.date.split('-');

                return `
                    <div class="history-item">
                        <div>
                            <div class="history-date">${d}.${m}.${y}</div>
                            <div class="history-spend">Спенд: $${item.expense.toFixed(0)}</div>
                        </div>
                        <div class="history-right">
                            <div class="history-date ${color}">${profit > 0 ? '+' : ''}$${profit.toFixed(0)}</div>
                            <div class="history-spend ${color}">ROI ${roi.toFixed(0)}%</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- Задачи ---
        function saveTask() {
            const text = document.getElementById('task-text').value.trim();
            if (!text) return;
            data.tasks.unshift({ id: Date.now().toString(), text, done: false });
            forceCloseModals();
            saveData();
        }

        function toggleTask(id) {
            const task = data.tasks.find(t => t.id === id);
            if (task) { task.done = !task.done; saveData(); }
        }

        function renderTasks() {
            const container = document.getElementById('tasks-list');
            if (data.tasks.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-secondary)">Все задачи выполнены</div>';
                return;
            }
            container.innerHTML = data.tasks.map(t => `
                <div class="task-item ${t.done ? 'done' : ''}" onclick="toggleTask('${t.id}')">
                    <div class="task-checkbox"></div>
                    <div class="task-content"><div class="task-text">${t.text}</div></div>
                </div>
            `).join('');
        }

        // --- Заметки (Логика iOS Notes) ---
        const noteTextarea = document.getElementById('note-textarea');
        
        noteTextarea.addEventListener('input', (e) => {
            if (!currentNoteId) return;
            const note = data.notes.find(n => n.id === currentNoteId);
            if (note) {
                note.text = e.target.value;
                note.date = new Date().toISOString();
                saveData();
            }
        });

        function createNewNote() {
            const id = Date.now().toString();
            data.notes.unshift({ id, text: '', date: new Date().toISOString() });
            openNoteEditor(id);
            saveData();
        }

        function openNoteEditor(id) {
            currentNoteId = id;
            const note = data.notes.find(n => n.id === id);
            noteTextarea.value = note ? note.text : '';
            document.getElementById('note-editor').classList.add('active');
            setTimeout(() => noteTextarea.focus(), 300);
        }

        function closeNoteEditor() {
            // Если заметка пустая при закрытии - удаляем её автоматически
            const note = data.notes.find(n => n.id === currentNoteId);
            if (note && note.text.trim() === '') {
                data.notes = data.notes.filter(n => n.id !== currentNoteId);
                saveData();
            }
            document.getElementById('note-editor').classList.remove('active');
            currentNoteId = null;
        }

        function deleteCurrentNote() {
            if(confirm('Удалить эту заметку?')) {
                data.notes = data.notes.filter(n => n.id !== currentNoteId);
                saveData();
                closeNoteEditor();
            }
        }

        function renderNotes() {
            const container = document.getElementById('notes-list');
            if (data.notes.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-secondary)">Нет заметок</div>';
                return;
            }
            container.innerHTML = data.notes.map(n => {
                const lines = n.text.split('\n').filter(l => l.trim() !== '');
                const title = lines.length > 0 ? lines[0] : 'Новая заметка';
                const preview = lines.length > 1 ? lines[1] : 'Нет дополнительного текста';
                const d = new Date(n.date);
                const dateStr = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;

                return `
                    <div class="note-item" onclick="openNoteEditor('${n.id}')">
                        <div class="note-item-title">${title}</div>
                        <div class="note-item-preview">${preview}</div>
                        <div class="note-item-date">${dateStr}</div>
                    </div>
                `;
            }).join('');
        }

        function renderAll() {
            renderStats('fact');
            renderStats('uslov');
            renderHistory('fact');
            renderHistory('uslov');
            renderTasks();
            renderNotes();
        }

        renderAll();
    </script>
</body>
</html>
